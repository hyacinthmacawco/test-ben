<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ben 10 — Three.js Character Rig</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10151d; color: #e8edf5; font: 14px system-ui, sans-serif; }
    #scene { display: block; width: 100%; height: 100%; }
    #info { position: fixed; left: 16px; top: 14px; padding: 12px 14px; max-width: min(340px, calc(100vw - 32px)); border: 1px solid #ffffff20; border-radius: 12px; background: #18212dcc; backdrop-filter: blur(10px); line-height: 1.5; pointer-events: none; }
    #info strong { display:block; font-size: 15px; margin-bottom: 4px; }
    #info span { color: #aebbd0; }
    #capture-photo { position: fixed; top: 14px; right: 16px; z-index: 5; border: 1px solid #ffffff35; border-radius: 12px; padding: 11px 15px; color: #f4f7fb; background: #18212dcc; backdrop-filter: blur(10px); font: 600 14px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 18px #0005; }
    #capture-photo:hover { background: #26364acc; }
    #capture-photo:active { transform: scale(.97); }
    #capture-photo:focus-visible { outline: 2px solid #8bb8e8; outline-offset: 3px; }
    #rig-controls { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(96vw, 520px); padding: 10px; border: 1px solid #ffffff24; border-radius: 16px; background: #18212ddd; backdrop-filter: blur(12px); box-shadow: 0 8px 28px #0006; }
    #rig-controls button { border: 1px solid #ffffff30; border-radius: 10px; padding: 10px 13px; color: #eef4f0; background: #26364a; font: 600 13px system-ui, sans-serif; cursor: pointer; }
    #rig-controls button:hover, #rig-controls button[aria-pressed="true"] { background: #087c43; border-color: #39bd78; }
    #rig-controls button:focus-visible { outline: 2px solid #8bb8e8; outline-offset: 2px; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="info"><strong>Ben 10 character rig</strong><span>Drag to orbit · Scroll to zoom<br>Procedural Ben model driven by the articulated walking rig</span></div>
  <button id="capture-photo" type="button" aria-label="Take a photo of the scene">Take photo</button>
  <nav id="rig-controls" aria-label="Character animation controls">
    <button type="button" data-animation="walk" aria-pressed="true">Walk</button>
    <button type="button" data-animation="jump">Jump</button>
    <button type="button" data-animation="pickup">Pick up</button>
    <button type="button" data-animation="punch">Punch</button>
  </nav>
  <canvas id="scene"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
